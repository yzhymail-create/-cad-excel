name: Cloud Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: personal-account-app/mobile/package-lock.json

      - name: Install dependencies
        working-directory: personal-account-app/mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: EAS Build (APK)
        working-directory: personal-account-app/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
